<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Día · Mesa Dragón</title>
    <link rel="stylesheet" href="../css/cerrado.css">
</head>
<body>

    <!-- Apertura y cierre del día (#34). El estado sale del servidor (GET /jornadas/actual), no del
         localStorage: cualquier navegador ve lo mismo. Lo maneja js/cerrado.js. -->
    <div class="card">
        <div class="card-image">
            <img src="../assets/imagenes/imagenDragonCerrado.svg" alt="Logo Dragon">
        </div>

        <div class="card-content">
            <div class="title-container">
                <span class="title-small">DÍA</span>
                <span class="title-large" id="titulo-estado">…</span>
            </div>

            <p class="card-text" id="texto-estado">Consultando el estado del día…</p>

            <div id="resumen-dia" class="resumen" hidden></div>

            <div id="ordenes-abiertas" class="aviso-ordenes" hidden></div>

            <form id="form-dia" class="form-dia" hidden>
                <p class="card-text" id="texto-form"></p>
                <input type="text" id="dia-ci" placeholder="CI" autocomplete="username" required>
                <input type="password" id="dia-contrasenia" placeholder="Contraseña" autocomplete="current-password" required>
                <p class="error-dia" id="error-dia" hidden></p>
                <button type="submit" class="btn btn-editar" id="btn-dia">…</button>
            </form>

            <div class="buttons-container">
                <button class="btn btn-salir" id="btn-salir">SALIR</button>
                <button class="btn btn-editar" id="btn-volver" hidden>VOLVER</button>
            </div>
        </div>
    </div>

    <script type="module" src="../js/cerrado.js"></script>

</body>
</html>
